apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-demo
  labels:
    app.kubernetes.io/name: supply-chain-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-demo
        team: platform-security
        cost-center: portfolio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replaced with image@digest by the build workflow before the manifests are signed.
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
