name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.4
  FLUX_VERSION: 2.10.0
  KYVERNO_CHART_VERSION: 3.9.2
  HELM_VERSION: v4.3.1
  # Kyverno 1.19 is tested on Kubernetes 1.33 to 1.35, so the cluster stays on 1.35.
  KIND_NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  KUBECTL_VERSION: v1.35.8

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # actionlint 1.7.12 does not understand the newer self-repository syntax yet.
    uses: ./.github/workflows/build-attest.yml # zizmor: ignore[self-repository]

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-attest.yml@${{ github.ref }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity "${SIGNER}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      # The payload is a multi-MB single line; the runner's secret masking stalled for 90 minutes printing it.
      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${SIGNER}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > sbom-attestation.json
          echo "Verified SBOM attestation: $(wc -c < sbom-attestation.json) bytes"
          jq -r '.payload' sbom-attestation.json | base64 -d | jq -c '{predicateType, subject}' \
            || echo "verified, but the payload could not be summarised"

      - name: Verify SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-attest.yml"

  e2e:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      MANIFESTS: ${{ needs.build.outputs.manifests }}
      MANIFESTS_DIGEST: ${{ needs.build.outputs.manifests-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Write access is only for pushing the deliberately bad e2e variants.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: ${{ env.FLUX_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ env.KIND_NODE_IMAGE }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: supply-chain

      - name: Run admission and GitOps assertions
        run: ./scripts/e2e.sh

  trace:
    needs: [build, verify, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      COLLECTOR_IMAGE: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
      JAEGER_IMAGE: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start OpenTelemetry Collector and Jaeger
        run: |
          mkdir -p otel-out
          chmod 777 otel-out
          docker network create otel
          docker run -d --name jaeger --network otel -p 16686:16686 "${JAEGER_IMAGE}"
          docker run -d --name collector --network otel -p 4318:4318 \
            -v "${PWD}/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "${PWD}/otel-out:/out" \
            "${COLLECTOR_IMAGE}"

      - name: Export this run as a trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_trace.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --endpoint http://localhost:4318/v1/traces \
            --jaeger http://localhost:16686 \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Flush collector
        if: always()
        run: |
          docker stop collector
          docker logs collector

      - name: Upload OTLP export
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otel-trace
          path: otel-out/traces.json
          if-no-files-found: warn
