name: supply-chain

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

env:
    IMAGE: ghcr.io/moheedinamdar/supply-chain-security-pipeline

jobs:
    build-sign-attest:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write # keyless cosign signing via OIDC
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: ./app
                  push: true
                  tags: ${{ env.IMAGE }}:${{ github.sha }}

            - name: Generate SBOM (Syft)
              uses: anchore/sbom-action@v0
              with:
                  image: ${{ env.IMAGE }}:${{ github.sha }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Scan for vulnerabilities (Grype)
              uses: anchore/scan-action@v4
              with:
                  image: ${{ env.IMAGE }}:${{ github.sha }}
                  fail-build: true
                  severity-cutoff: high

            - name: Install cosign
              uses: sigstore/cosign-installer@v3

            - name: Keyless sign image
              run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

            - name: Attest SBOM
              run: |
                  cosign attest --yes --type spdxjson \
                    --predicate sbom.spdx.json \
                    "${IMAGE}@${{ steps.build.outputs.digest }}"

    # SLSA Build L3 provenance via the official reusable generator.
    provenance:
        needs: build-sign-attest
        permissions:
            actions: read
            id-token: write
            packages: write
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
        with:
            image: ghcr.io/moheedinamdar/supply-chain-security-pipeline
            digest: ${{ needs.build-sign-attest.outputs.digest }}
        secrets:
            registry-username: ${{ github.actor }}
            registry-password: ${{ secrets.GITHUB_TOKEN }}
